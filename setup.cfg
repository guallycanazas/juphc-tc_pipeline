[nosetests]
verbosity=2
with-spec=1
spec-color=1
with-coverage=1
cover-package=service
cover-erase=1
cover-html=1
cover-html-dir=htmlcov

[coverage:run]
source = service
branch = True

[coverage:report]
show_missing = True
skip_covered = False

[flake8]
max-line-length = 127
exclude = .git,__pycache__,.venv,venv,build,dist
ignore = E203,W503

[pylint]
max-line-length = 127
disable = C0114,C0115,C0116,R0903

[tool:pytest]
addopts = --cov=service --cov-report=term-missing
