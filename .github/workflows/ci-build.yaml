name: CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accounts
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install nose coverage flake8 pylint flask flask-talisman flask-cors

      - name: Lint with flake8
        run: |
          flake8 service tests --count --select=E9,F63,F7,F82 --show-source --statistics || true
          flake8 service tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run unit tests with nosetests
        run: |
          nosetests -v --with-coverage --cover-package=service --cover-erase
